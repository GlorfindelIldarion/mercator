name: Update Chart appVersion

on:
  push:
    branches:
      - master
    paths:
      - 'version.txt'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  update-chart:
    name: Update Chart appVersion
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Set Chart version and appVersion
        uses: mikefarah/yq@master
        env:
          CHART_APPVERSION: ${{ steps.version.outputs.version }}
        with:
          cmd: yq -i '.version = strenv(CHART_APPVERSION) | .appVersion = strenv(CHART_APPVERSION)'  docs/_helm_chart/chart/Chart.yaml

      - name: Commit Chart version and appVersion

        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: bump chart version to ${{ steps.version.outputs.version }}"
          add: docs/_helm_chart/chart/Chart.yaml

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: docs/_helm_chart
          skip_existing: true
          mark_as_latest: false
          pages_branch: gh-pages
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Trigger docs deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yaml',
              ref: 'master'
            })