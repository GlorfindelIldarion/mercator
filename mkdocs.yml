docs_dir: docs
exclude_docs: |
  _helm_chart/

# Project information
site_name: Mercator
site_description: Mapping the Information System !
site_url: https://sourcentis.github.io/mercator/

# Repository
repo_url: https://github.com/sourcentis/mercator
edit_uri: edit/master/docs

# Copyright
copyright: Copyright <a href="https://www.gnu.org/licenses/licenses.en.html">GPL</a>.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    #- toc.integrate
    - content.code.copy
    - content.action.edit
    - content.action.view
    - palette.toggle
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - css/overrides.css

extra:
  generator: false

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            GETTING STARTED: DÉMARRAGE
            DATA MODEL: MODÈLE DE DONNÉES
            PROCESS & ANALYSIS: PROCESSUS & ANALYSE
            API & INTEGRATION: API & INTÉGRATION
            OPERATIONS: OPÉRATIONS
            Cartography: Cartographie
            Features: Fonctionnalités
            Use Cases: Cas d'usage
            Data Model: Modèle de données
            Maturity: Maturité
            Queries: Requêtes
            Reports: Rapports
            API Filters: Filtres d'API
            Vulnerabilities: Vulnérabilités
            References: Références
      reconfigure_material: true

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - GETTING STARTED:
      - Introduction: index.md
      - -- Cartography: cartography.md
      - -- Features: features.md
      - -- Use Cases: usecases.md
  - DATA MODEL:
      - -- Data Model: model.md
      - -- Maturity: maturity.md
  - PROCESS & ANALYSIS:
      - -- BPMN: bpmn.md
      - -- Application: application.md
      - -- Queries: queries.md
      - -- Reports: reports.md
  - API & INTEGRATION:
      - -- API: api.md
      - -- API Filters: apifilters.md
      - -- Import: import.md
      - -- Vulnerabilities: vulnerabilities.md
  - OPERATIONS:
      - -- Administration: admin.md
      - -- Configuration: config.md
      - -- References: references.md
